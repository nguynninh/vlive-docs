# --- Frontend (Next.js) ---
server {
    listen 80;
    server_name docs-mobile.vtvlive.vn;

    # Chuyển hướng toàn bộ HTTP sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name docs-mobile.vtvlive.vn;

    ssl_certificate     /etc/letsencrypt/live/docs-mobile.vtvlive.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs-mobile.vtvlive.vn/privkey.pem;

    # Bản mới nhất, phục vụ ở gốc "/"
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Các bản release cũ, giữ song song theo path ---
    # Mỗi tag mới: thêm 1 block location + build với BASE_PATH tương ứng,
    # chạy PM2 trên 1 port riêng (xem deploy.sh).

    location /v1.1.1/ {
        proxy_pass http://127.0.0.1:3003/v1.1.1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
